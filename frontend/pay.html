<!DOCTYPE html>
<html lang="en">
  <head>

        font-family: Arial, sans-serif;
        background: #f7f7fb;

        color: #333;
      }
      .card {

      }
      h1 {
        font-size: 22px;
        margin: 0 0 10px;
      }
      p {
        line-height: 1.6;
      }
      .muted {
        color: #666;
        font-size: 14px;
      }

    <div class="card">
      <h1>Payment Not Required</h1>
      <p>
        Online payment via this page has been disabled. Please follow the
        instructions sent to your email.
      </p>
      <p class="muted">
        If you have questions, contact support or reply to the email you
        received.
      </p>

</html>
